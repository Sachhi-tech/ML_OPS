name: ML_OPS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirement.txt

      - name: Check Python files
        run: |
          python -m compileall SRC

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t placement-ml .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag placement-ml ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/placement-ml:latest

      - name: Push Docker image
        run: |
          docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/placement-ml:latest